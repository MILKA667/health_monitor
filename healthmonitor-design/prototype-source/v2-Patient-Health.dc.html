<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пациент — история</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1D5FA8}
:focus-visible{outline:2px solid #1D5FA8;outline-offset:2px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.f{height:48px;box-sizing:border-box;padding:0 12px;border:1px solid #B9C0C8;border-radius:4px;background:#FFFFFF;font:inherit;font-size:17px;color:#1B1F24;width:100%}
.tb{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:-1px;border-top:2px solid transparent;font-size:14px;color:#4A535D;text-decoration:none}
.tb:hover{color:#1B1F24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1F24; font-size: 17px; line-height: 24px; overflow: hidden">

<div style="flex-grow: 1; overflow-y: auto; padding: 52px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">История измерений</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 500">Показатель</span><select class="f" value="{{m}}" onChange="{{onM}}"><option value="g">Глюкоза</option><option value="p">Давление</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 500">Период</span><select class="f" value="{{d}}" onChange="{{onD}}"><option value="7">7 дней</option><option value="14">14 дней</option></select></label>
</div>

<section aria-label="График" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; line-height: 20px; color: #4A535D"><span>Среднее <span class="num" style="color: #1B1F24">{{avg}}</span></span><span>Вне цели <span class="num" style="color: #1B1F24">{{out}}</span></span></div>
<svg role="img" aria-label="{{chartLabel}}" viewBox="0 0 358 180" style="width: 100%; height: auto; display: block" font-family="IBM Plex Mono, monospace" font-size="11">
<rect x="30" y="{{bandY}}" width="324" height="{{bandH}}" fill="#F0F2F4"></rect>
<line x1="30" y1="{{critY}}" x2="354" y2="{{critY}}" stroke="#B42318" stroke-dasharray="3 3"></line>
<text x="26" y="{{critTY}}" fill="#B42318" text-anchor="end">{{critL}}</text>
<text x="26" y="{{hiTY}}" fill="#646E78" text-anchor="end">{{hiL}}</text>
<polyline points="{{pts}}" fill="none" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round"></polyline>
<path d="{{outDots}}" fill="#B42318"></path>
<path d="{{inDots}}" fill="#1B1F24"></path>
</svg>
<div style="display: flex; justify-content: space-between; padding-left: 30px; font-size: 13px; color: #646E78"><span class="num">{{first}}</span><span class="num">28.10</span></div>
<span style="font-size: 13px; line-height: 18px; color: #646E78">Серая полоса — цель, пунктир — критический порог. Красные точки — значения вне цели.</span>
</section>

<section aria-label="Измерения" style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 4px; font-size: 17px; line-height: 24px; font-weight: 600">Измерения</h2>
<table style="width: 100%; border-collapse: collapse; font-size: 15px; line-height: 20px">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{caption}}</caption>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<tr><td class="num" style="padding: 10px 0; border-bottom: 1px solid #ECEEF1; color: #4A535D">{{r.t}}</td><td class="num" style="{{r.vs}}">{{r.v}}</td><td style="padding: 10px 0 10px 12px; border-bottom: 1px solid #ECEEF1; color: #4A535D">{{r.c}}</td></tr>
</sc-for>
</tbody>
</table>
</section>
</div>

<nav aria-label="Разделы" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 20px; border-top: 1px solid #D9DDE2; background: #FFFFFF">
<a class="tb" href="v2-Patient-Home.dc.html">Сегодня</a>
<a class="tb" href="v2-Patient-Health.dc.html" aria-current="page" style="color: #1D5FA8; font-weight: 600; border-top-color: #1D5FA8">История</a>
<a class="tb" href="v2-Patient-Chat.dc.html">Чат</a>
<a class="tb" href="v2-Patient-Profile.dc.html">Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 'g', d: '7' }; }
  renderVals() {
    var self = this, s = this.state;
    var G = [6.0, 5.9, 6.2, 5.7, 6.3, 5.9, 6.1, 5.8, 6.1, 5.4, 5.0, 4.6, 3.4, 2.9];
    var P = [138, 142, 140, 146, 150, 148, 152, 147, 151, 149, 158, 162, 171, 182];
    var cfg = s.m === 'g'
      ? { data: G, min: 2, max: 12, lo: 4.4, hi: 10, crit: 3.9, critL: '3,9', hiL: '10', unit: 'ммоль/л', dp: 1, isOut: function (x) { return x < 4.4 || x > 10; }, ctx: ['натощак', 'перед сном'] }
      : { data: P, min: 100, max: 200, lo: 100, hi: 140, crit: 160, critL: '160', hiL: '140', unit: 'мм рт. ст., верхнее', dp: 0, isOut: function (x) { return x > 140 || x < 100; }, ctx: ['утро', 'вечер'] };
    var n = parseInt(s.d, 10), v = cfg.data.slice(cfg.data.length - n);
    var Y = function (x) { return 170 - (x - cfg.min) / (cfg.max - cfg.min) * 160; };
    var X = function (i) { return 30 + i * (324 / (n - 1)); };
    var dot = function (i) { return 'M' + (X(i) - 3).toFixed(1) + ' ' + Y(v[i]).toFixed(1) + 'a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'; };
    var o = '', inn = '', out = 0;
    v.forEach(function (x, i) { if (cfg.isOut(x)) { o += dot(i); out++; } else inn += dot(i); });
    var f = function (x) { return x.toFixed(cfg.dp).replace('.', ','); };
    var days = ['15.10', '16.10', '17.10', '18.10', '19.10', '20.10', '21.10', '22.10', '23.10', '24.10', '25.10', '26.10', '27.10', '28.10'].slice(14 - n);
    var rows = v.map(function (x, i) { return { t: days[i] + ' · ' + (i % 2 ? '21:05' : '08:10'), v: f(x), c: cfg.ctx[i % 2], vs: 'padding: 10px 0; border-bottom: 1px solid #ECEEF1; text-align: right; font-weight: 500; color: ' + (cfg.isOut(x) ? '#B42318' : '#1B1F24') }; }).reverse();
    var critY = Y(cfg.crit);
    return {
      m: s.m, d: s.d, pts: v.map(function (x, i) { return X(i).toFixed(1) + ',' + Y(x).toFixed(1); }).join(' '),
      outDots: o || 'M0 0', inDots: inn || 'M0 0',
      bandY: Y(cfg.hi).toFixed(1), bandH: (Y(cfg.lo) - Y(cfg.hi)).toFixed(1),
      critY: critY.toFixed(1), critTY: (critY + 4).toFixed(1), critL: cfg.critL, hiTY: (Y(cfg.hi) + 4).toFixed(1), hiL: cfg.hiL,
      avg: f(v.reduce(function (a, b) { return a + b; }, 0) / n) + ' ' + cfg.unit.split(',')[0], out: out + ' из ' + n,
      first: days[0], rows: rows, caption: (s.m === 'g' ? 'Глюкоза, ' : 'Давление, ') + cfg.unit,
      chartLabel: (s.m === 'g' ? 'Глюкоза' : 'Верхнее давление') + ' за ' + n + ' дней, вне цели ' + out + ' значений, последнее ' + f(v[n - 1]),
      onM: function (e) { self.setState({ m: e.target.value }); },
      onD: function (e) { self.setState({ d: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
