<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пациент — чат с врачом</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1D5FA8}
:focus-visible{outline:2px solid #1D5FA8;outline-offset:2px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.pbtn{height:48px;padding:0 16px;border:none;border-radius:4px;background:#1D5FA8;color:#FFFFFF;font:inherit;font-size:17px;font-weight:600;cursor:pointer;flex-shrink:0}
.pbtn:hover{background:#164C87}
.pbtn:disabled{background:#F0F2F4;color:#8A939D;border:1px solid #D9DDE2;cursor:not-allowed}
.tb{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:-1px;border-top:2px solid transparent;font-size:14px;color:#4A535D;text-decoration:none}
.tb:hover{color:#1B1F24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1F24; font-size: 17px; line-height: 24px; overflow: hidden">

<header style="padding: 52px 16px 12px; border-bottom: 1px solid #D9DDE2; display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Чат с врачом</h1>
<span style="font-size: 15px; line-height: 20px; color: #4A535D">Смирнова Е. А., эндокринолог · отвечает с 9:00 до 18:00</span>
</header>

<ol style="list-style: none; margin: 0; padding: 0; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column">
<li style="padding: 10px 16px; font-size: 15px; line-height: 20px; color: #7A1A12; background: #FDECEA">Сегодня, <span class="num">10:38</span> — глюкоза 2,9 ммоль/л вне порога. Врач уведомлён.</li>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
<li style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #ECEEF1">
<span style="font-size: 15px; line-height: 20px"><span style="{{m.whoStyle}}">{{m.who}}</span> <span class="num" style="color: #646E78">{{m.time}}</span></span>
<span>{{m.text}}</span>
</li>
</sc-for>
</ol>

<div style="padding: 12px 16px 8px; border-top: 1px solid #D9DDE2; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px; align-items: flex-end">
<label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Сообщение врачу</span><textarea rows="2" placeholder="Сообщение врачу" value="{{draft}}" onChange="{{onDraft}}" style="flex-grow: 1; min-width: 0; resize: none; box-sizing: border-box; padding: 8px 12px; border: 1px solid #B9C0C8; border-radius: 4px; font: inherit; font-size: 17px; color: #1B1F24"></textarea></label>
<button type="button" class="pbtn" onClick="{{send}}" disabled="{{off}}">Отправить</button>
</div>
<span style="font-size: 13px; line-height: 18px; color: #4A535D">Чат не для экстренных случаев. При резком ухудшении звоните <a href="tel:103">103</a>.</span>
</div>

<nav aria-label="Разделы" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 20px; border-top: 1px solid #D9DDE2; background: #FFFFFF">
<a class="tb" href="v2-Patient-Home.dc.html">Сегодня</a>
<a class="tb" href="v2-Patient-Health.dc.html">История</a>
<a class="tb" href="v2-Patient-Chat.dc.html" aria-current="page" style="color: #1D5FA8; font-weight: 600; border-top-color: #1D5FA8">Чат</a>
<a class="tb" href="v2-Patient-Profile.dc.html">Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { draft: '', sent: [] }; }
  renderVals() {
    var self = this, s = this.state;
    var msgs = [
      ['me', 'Голова кружится, руки дрожат. Глюкометр показал 2,9.', '10:40'],
      ['doc', 'Нина Петровна, примите 15–20 г быстрых углеводов: стакан сока или 4 таблетки глюкозы. Через 15 минут повторите замер.', '10:42'],
      ['me', 'Выпила сок. Жду.', '10:44']
    ].concat(s.sent).map(function (m) {
      var me = m[0] === 'me';
      return { who: me ? 'Вы' : 'Смирнова Е. А.', text: m[1], time: m[2], whoStyle: 'font-weight: 600; color: ' + (me ? '#4A535D' : '#1B1F24') };
    });
    return {
      msgs: msgs, draft: s.draft, off: !(s.draft || '').trim(),
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      send: function () { var t = (self.state.draft || '').trim(); if (!t) return; self.setState({ draft: '', sent: self.state.sent.concat([['me', t, '10:46']]) }); }
    };
  }
}
</script>
</body>
</html>
