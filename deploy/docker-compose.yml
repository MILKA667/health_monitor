# Продакшен: PostgreSQL + Flask (gunicorn) + nginx со статикой фронтенда.
# Образы собирает GitHub Actions при пуше в main. Настройки — в .env рядом (образец: .env.example).
name: healthmonitor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-health_monitor}
      POSTGRES_USER: ${DB_USER:-healthmonitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX не задан}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-healthmonitor}
      BEHIND_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
